<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Palmwire City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Palmwire City - an original open-world crime game set in a sun-soaked coastal metropolis.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script>
    // Collect early errors so headless test runs can read them from the page.
    window.__errors = [];
    window.addEventListener('error', function (e) { window.__errors.push(String(e.message || e)); });
    window.addEventListener('unhandledrejection', function (e) { window.__errors.push('promise: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  </script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="ui"></div>
  <div id="loading">
    <div class="load-title">PALMWIRE CITY</div>
    <div class="load-sub">building the city&hellip;</div>
  </div>
  <div id="errlog"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
